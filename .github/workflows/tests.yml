name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sql]"

      - name: Run unit tests
        run: python -m pytest -m unit

  e2e:
    name: E2E Tests (py3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sql]"

      - name: Run e2e tests
        run: python -m pytest -m e2e

  package:
    name: Distribution Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and validate distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl sqlalchemy
      - name: Test installed wheel outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from text2ql import Text2QL, create_sqlite_executor
          result = Text2QL().generate("count users", target="sql", schema={"entities": ["users"], "fields": {"users": ["id"]}})
          with create_sqlite_executor({"users": [{"id": 1}, {"id": 2}]}) as executor:
              assert list(executor.execute(result)[0].values()) == [2]
          PY
